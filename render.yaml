services:
  - type: web
    name: spicy-dryfruits-inventory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dryfruits-db
          property: connectionString

databases:
  - name: dryfruits-db
    plan: free
    databaseName: dryfruits
    user: dryfruits
